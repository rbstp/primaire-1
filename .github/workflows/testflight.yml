name: testflight
run-name: "[testflight] - shipping ${{ github.event.pull_request.merge_commit_sha || github.ref_name }}"

on:
  pull_request:
    types:
      - closed
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      version:
        description: version to ship, without the leading v (e.g. 0.3.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-ship:
    concurrency: testflight
    environment:
      name: testflight
      url: https://appstoreconnect.apple.com/apps
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || (github.event.pull_request.merged
              && !contains(github.event.pull_request.title, '[skip-release]')) }}
    runs-on: macos-27
    permissions:
      contents: write

    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: work out the version
        id: version
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
            IFS=. read -r major minor patch <<< "${latest:-v0.0.0}"
            major="${major#v}"
            # Every commit since the last tag counts, so a cancelled pending run cannot lose a feat bump.
            range="${latest:+$latest..}HEAD"
            if { git log --format='%s%n%b' "$range"; printf '%s\n' "$TITLE"; } | grep -qiE '^(\[[A-Z]+-[0-9]+\] )?feat[(!:]'; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            version="$major.$minor.$patch"
          fi
          echo "shipping $version build $GITHUB_RUN_NUMBER (previous tag: ${latest:-none})"
          {
            echo "version=$version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TITLE: ${{ github.event.pull_request.title }}

      - name: check for the signing secrets
        run: |
          missing=
          for name in APPLE_DIST_CERT_P12 APPLE_DIST_CERT_PASSWORD APPLE_PROVISIONING_PROFILE APPLE_KEY_P8 APPLE_KEY_ID APPLE_ISSUER_ID; do
            eval "value=\$$name"
            [ -n "$value" ] || missing="$missing $name"
          done
          [ -z "$missing" ] || {
            echo "unset repository secrets:$missing"
            echo "See README.md, Livraison à TestFlight."
            exit 1
          }
        env:
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_KEY_P8: ${{ secrets.APPLE_KEY_P8 }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}

      - name: install xcodegen
        run: brew install xcodegen

      - name: generate the project
        run: xcodegen generate

      # ci.yml tests the pull request, not the revision shipped, and a manual dispatch skips it.
      - name: test the revision being shipped
        run: |
          name="$(xcrun simctl list devices available -j \
            | jq -r '.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone")) | .name' \
            | sort -V | tail -1)"
          [ -n "$name" ] || { echo "no iPhone simulator on this runner"; exit 1; }
          xcodebuild test -project MissionNinja.xcodeproj -scheme MissionNinja \
            -destination "platform=iOS Simulator,name=$name" \
            -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO

      - name: import the signing certificate and profile
        id: signing
        run: |
          # decode NAME VALUE FILE: whitespace-tolerant base64, fails naming the secret.
          decode() {
            printf '%s' "$2" | tr -d '\n\r\t ' | base64 --decode > "$3" || {
              echo "$1 is not valid base64; set it with: base64 -i <file> | gh secret set $1"; exit 1; }
            [ -s "$3" ] || { echo "$1 is empty; set it with: base64 -i <file> | gh secret set $1"; exit 1; }
          }
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          decode APPLE_DIST_CERT_P12 "$APPLE_DIST_CERT_P12" "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -f pkcs12
          # Without a partition list, codesign's first use of the key blocks on a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" \
            "$keychain" > /dev/null
          security list-keychains -d user | tr -d '"' \
            | xargs security list-keychains -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          decode APPLE_PROVISIONING_PROFILE "$APPLE_PROVISIONING_PROFILE" "$RUNNER_TEMP/profile.mobileprovision"
          plist="$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")" || {
            echo "APPLE_PROVISIONING_PROFILE is not a .mobileprovision file"; exit 1; }
          uuid="$(printf '%s' "$plist" | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin)"
          name="$(printf '%s' "$plist" | /usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin)"
          printf '%s' "$plist" | /usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' -c 'Print ExpirationDate' /dev/stdin
          mv "$RUNNER_TEMP/profile.mobileprovision" "$profiles/$uuid.mobileprovision"
          decode APPLE_KEY_P8 "$APPLE_KEY_P8" "$RUNNER_TEMP/AuthKey.p8"

          # Whatever the profile is actually called wins, so renaming it in the
          # Apple portal cannot break the build.
          echo "profile=$name" >> "$GITHUB_OUTPUT"
        env:
          APPLE_DIST_CERT_P12: ${{ secrets.APPLE_DIST_CERT_P12 }}
          APPLE_DIST_CERT_PASSWORD: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          APPLE_KEY_P8: ${{ secrets.APPLE_KEY_P8 }}

      - name: archive
        run: |
          xcodebuild archive -project MissionNinja.xcodeproj -scheme MissionNinja -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath .build/DerivedData \
            -archivePath .build/MissionNinja.xcarchive \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PROFILE: ${{ steps.signing.outputs.profile }}

      - name: upload to testflight
        run: |
          options="$RUNNER_TEMP/ExportOptions.plist"
          cp scripts/ExportOptions.plist "$options"
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:dev.rbstp.missionninja $PROFILE" "$options"
          xcodebuild -exportArchive -archivePath .build/MissionNinja.xcarchive \
            -exportOptionsPlist "$options" -exportPath .build/export \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_KEY_ID" -authenticationKeyIssuerID "$APPLE_ISSUER_ID"
        env:
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
          PROFILE: ${{ steps.signing.outputs.profile }}

      - name: tag the release
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
            exit 0
          fi
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/$TAG"
        env:
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      # always() on purpose: cancelling right after the import is exactly when the key would be left behind.
      - name: forget the signing material
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles"/*.mobileprovision
